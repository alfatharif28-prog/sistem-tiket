<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UyeeFest - Tiket Online</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: black;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎫 UyeeFest</h1>

    <p class="subtitle">
        Pembelian Tiket Online
    </p>

    <div class="info">
        <strong>Harga Tiket</strong>
        <br>
        Rp50.000 / orang
    </div>

    <form onsubmit="prosesPembayaran(event)">

        <label for="nama">
            Nama Lengkap
        </label>

        <input
            type="text"
            id="nama"
            placeholder="Masukkan nama lengkap"
            required
        >

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="contoh@email.com"
            required
        >

        <label for="telepon">
            Nomor WhatsApp
        </label>

        <input
            type="tel"
            id="telepon"
            placeholder="08xxxxxxxxxx"
            required
        >

       <label for="jumlah">
    Jumlah Tiket
</label>

<select id="jumlah" required>
    <option value="1">1 Tiket</option>
</select>

        <button type="submit">
            Lanjut ke Pembayaran
        </button>

    </form>

</div>
<script>
function prosesPembayaran(event) {
    event.preventDefault();

    const nama = document.getElementById("nama").value;
    const email = document.getElementById("email").value;
    const telepon = document.getElementById("telepon").value;
    const jumlah = Number(document.getElementById("jumlah").value);

    const harga = 50000;
    const total = jumlah * harga;

    document.querySelector(".container").innerHTML = `
        <h1>🎟️ Pembayaran UyeeFest</h1>

        <p class="subtitle">
            Silakan lakukan pembayaran melalui transfer bank
        </p>

        <div class="info">
            <strong>Detail Pembelian</strong><br><br>

            Nama: ${nama}<br>
            Email: ${email}<br>
            WhatsApp: ${telepon}<br>
            Jumlah Tiket: ${jumlah}<br><br>

            <strong>Total Pembayaran:</strong><br>
            <span style="font-size:24px;">
                Rp${total.toLocaleString("id-ID")}
            </span>
        </div>

        <div class="info">
            <strong>Transfer Bank</strong><br><br>

            Bank BCA<br>
            No. Rekening: <strong>1160544887</strong><br>
            Atas Nama: <strong>Muhammad Fadhil Pratama</strong>
        </div>

        <button onclick="location.reload()">
            Kembali
        </button>
    `;
}
</script>
</body>
</html>
